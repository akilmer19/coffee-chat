name: Coffee Chat Pairings

on:
  schedule:
    # Fires every Tuesday at 18:00 UTC = 10am PT / 1pm ET (US standard time).
    # Biweekly cadence is enforced in pair.py (BIWEEKLY / BIWEEKLY_PARITY):
    # it only pairs on odd ISO weeks -> Nov 3, Nov 17, Dec 1, Dec 15, ...
    # Note: GitHub cron is UTC and ignores daylight saving, so during US DST
    # (mid-Mar to early-Nov) this lands at 11am PT / 2pm ET.
    - cron: "0 18 * * 2"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated pairing history

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pairing
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python pair.py

      - name: Commit updated history
        run: |
          git config user.name "coffee-chat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json state/last_run.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update pairing history / diagnostics"
            git push
          else
            echo "No state changes to commit."
          fi
