name: Coffee Chat Pairings

on:
  schedule:
    # Mondays at 15:00 UTC = 8am PT / 11am ET. Adjust to taste.
    # Want biweekly? Keep weekly here and gate inside pair.py on week number.
    - cron: "0 15 * * 1"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated pairing history

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pairing
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python pair.py

      - name: Commit updated history
        run: |
          git config user.name "coffee-chat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json
          git diff --staged --quiet || git commit -m "Update pairing history"
          git push
